[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vic-utm-builder-mcp"
version = "1.0.0"
description = "MCP server for marketers and creators: build, lint and classify UTM links for GA4, batch links per platform."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Vic" }]
keywords = ["mcp", "model-context-protocol", "utm", "ga4", "social-media", "analytics", "marketing"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Internet :: WWW/HTTP", "Intended Audience :: Developers"]
dependencies = ["mcp>=2.3,<3", "pydantic>=2.7"]

[project.urls]
Homepage = "https://github.com/voidgazer009/vic-mcp-servers"
Source = "https://github.com/voidgazer009/vic-mcp-servers/tree/main/servers/social-media/utm-builder"

[project.scripts]
vic-utm-builder-mcp = "vic_utm_builder.server:main"

[project.optional-dependencies]
dev = ["pytest>=8", "anyio>=4"]

[tool.hatch.build.targets.wheel]
packages = ["src/vic_utm_builder"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
