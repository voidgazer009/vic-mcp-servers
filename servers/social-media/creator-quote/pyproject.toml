[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vic-creator-quote-mcp"
version = "1.0.0"
description = "MCP server for brands and sellers: judge influencer quotes by CPM, CPE, usage rights and payback."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Vic" }]
keywords = ["mcp", "model-context-protocol", "influencer-marketing", "creator", "cpm", "social-media"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business", "Intended Audience :: Developers"]
dependencies = ["mcp>=2.3,<3", "pydantic>=2.7"]

[project.urls]
Homepage = "https://github.com/voidgazer009/vic-mcp-servers"
Source = "https://github.com/voidgazer009/vic-mcp-servers/tree/main/servers/social-media/creator-quote"

[project.scripts]
vic-creator-quote-mcp = "vic_creator_quote.server:main"

[project.optional-dependencies]
dev = ["pytest>=8", "anyio>=4"]

[tool.hatch.build.targets.wheel]
packages = ["src/vic_creator_quote"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
