[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vic-transport-ids-mcp"
version = "1.0.0"
description = "MCP server to validate container numbers (ISO 6346), AWB numbers and container size/type codes."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Vic" }]
keywords = ["mcp", "model-context-protocol", "logistics", "container", "iso-6346", "air-waybill"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business",
  "Intended Audience :: Developers",
]
dependencies = ["mcp>=2.3,<3", "pydantic>=2.7"]

[project.urls]
Homepage = "https://github.com/voidgazer009/vic-mcp-servers"
Source = "https://github.com/voidgazer009/vic-mcp-servers/tree/main/servers/logistics/transport-ids"

[project.scripts]
vic-transport-ids-mcp = "vic_transport_ids.server:main"

[project.optional-dependencies]
dev = ["pytest>=8", "anyio>=4"]

[tool.hatch.build.targets.wheel]
packages = ["src/vic_transport_ids"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
