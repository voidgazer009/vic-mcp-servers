[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vic-demurrage-mcp"
version = "1.0.0"
description = "MCP server for container demurrage and detention: last free day, tiered charges, what-if dates, invoice audit."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Vic" }]
keywords = ["mcp", "model-context-protocol", "logistics", "demurrage", "detention", "container", "freight"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business",
  "Intended Audience :: Developers",
]
dependencies = ["mcp>=2.3,<3", "pydantic>=2.7"]

[project.urls]
Homepage = "https://github.com/voidgazer009/vic-mcp-servers"
Source = "https://github.com/voidgazer009/vic-mcp-servers/tree/main/servers/logistics/demurrage-detention"

[project.scripts]
vic-demurrage-mcp = "vic_demurrage.server:main"

[project.optional-dependencies]
dev = ["pytest>=8", "anyio>=4"]

[tool.hatch.build.targets.wheel]
packages = ["src/vic_demurrage"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
