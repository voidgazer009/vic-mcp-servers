[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vic-export-quote-mcp"
version = "1.0.0"
description = "MCP server for export sales: correct quotes across Incoterms, container loading, live FX and Incoterms 2020 guidance."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Vic" }]
keywords = ["mcp", "model-context-protocol", "foreign-trade", "export", "incoterms", "quotation", "container-loading"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial",
  "Intended Audience :: Developers",
]
dependencies = ["mcp>=2.3,<3", "pydantic>=2.7"]

[project.urls]
Homepage = "https://github.com/voidgazer009/vic-mcp-servers"
Source = "https://github.com/voidgazer009/vic-mcp-servers/tree/main/servers/foreign-trade/export-quote"

[project.scripts]
vic-export-quote-mcp = "vic_export_quote.server:main"

[project.optional-dependencies]
dev = ["pytest>=8", "anyio>=4"]

[tool.hatch.build.targets.wheel]
packages = ["src/vic_export_quote"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
