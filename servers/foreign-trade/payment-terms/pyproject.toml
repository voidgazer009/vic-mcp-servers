[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vic-payment-terms-mcp"
version = "1.0.0"
description = "MCP server for export payment terms: compare T/T, L/C, D/P, D/A, O/A, recommend terms and screen clauses."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Vic" }]
keywords = ["mcp", "model-context-protocol", "foreign-trade", "export", "payment-terms", "letter-of-credit"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial",
  "Intended Audience :: Developers",
]
dependencies = ["mcp>=2.3,<3", "pydantic>=2.7"]

[project.urls]
Homepage = "https://github.com/voidgazer009/vic-mcp-servers"
Source = "https://github.com/voidgazer009/vic-mcp-servers/tree/main/servers/foreign-trade/payment-terms"

[project.scripts]
vic-payment-terms-mcp = "vic_payment_terms.server:main"

[project.optional-dependencies]
dev = ["pytest>=8", "anyio>=4"]

[tool.hatch.build.targets.wheel]
packages = ["src/vic_payment_terms"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
