[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vic-sample-policy-mcp"
version = "1.0.0"
description = "MCP server for export sample policy: triage sample requests, price packages, first-order credit, ROI, clause drafts."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Vic" }]
keywords = ["mcp", "model-context-protocol", "foreign-trade", "export", "sample-policy", "letter-of-credit"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business",
  "Intended Audience :: Developers",
]
dependencies = ["mcp>=2.3,<3", "pydantic>=2.7"]

[project.urls]
Homepage = "https://github.com/voidgazer009/vic-mcp-servers"
Source = "https://github.com/voidgazer009/vic-mcp-servers/tree/main/servers/foreign-trade/sample-policy"

[project.scripts]
vic-sample-policy-mcp = "vic_sample_policy.server:main"

[project.optional-dependencies]
dev = ["pytest>=8", "anyio>=4"]

[tool.hatch.build.targets.wheel]
packages = ["src/vic_sample_policy"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
